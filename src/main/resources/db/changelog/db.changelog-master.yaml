databaseChangeLog:
  - changeSet:
      id: 1-create-users-table
      author: marcelo
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(129)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(120)

  - changeSet:
      id: 2-create-external-projects-table
      author: marcelo
      changes:
        - createTable:
            tableName: external_projects
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: external_projects
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_external_projects_users

  - changeSet:
      id: 3-insert-sample-users
      author: marcelo
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: "admin@example.com"
              - column:
                  name: password
                  value: "$2b$10$FSePGW77lydRUldBJa11J.PlAW5QVyiSkvlUrrvJLXZn880jfiqyC"
              - column:
                  name: name
                  value: "Admin User"
        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: "john@example.com"
              - column:
                  name: password
                  value: "$2b$10$bq8KenuvvYTTtsw2Pd9XH.ioS1W6WtygJwtFioVUD0xvmnaTRxqw2"
              - column:
                  name: name
                  value: "John Doe"

  - changeSet:
      id: 4-insert-sample-external-projects
      author: marcelo
      changes:
        - insert:
            tableName: external_projects
            columns:
              - column:
                  name: id
                  value: "11111111-1111-1111-1111-111111111111"
              - column:
                  name: name
                  value: "Legacy Migration Project"
              - column:
                  name: user_id
                  valueNumeric: 1
        - insert:
            tableName: external_projects
            columns:
              - column:
                  name: id
                  value: "22222222-2222-2222-2222-222222222222"
              - column:
                  name: name
                  value: "Mobile App Integration"
              - column:
                  name: user_id
                  valueNumeric: 2

  - changeSet:
      id: 5-convert-users-externalprojects-to-many-to-many
      author: marcelo
      changes:
        - createTable:
            tableName: users_external_projects
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: external_project_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: users_external_projects
            columnNames: user_id,external_project_id
            constraintName: pk_users_external_projects
        - addForeignKeyConstraint:
            baseTableName: users_external_projects
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_uep_users
        - addForeignKeyConstraint:
            baseTableName: users_external_projects
            baseColumnNames: external_project_id
            referencedTableName: external_projects
            referencedColumnNames: id
            constraintName: fk_uep_external_projects
        - sql:
            sql: >
              INSERT INTO users_external_projects (user_id, external_project_id)
              SELECT user_id, id FROM external_projects WHERE user_id IS NOT NULL;
        - dropForeignKeyConstraint:
            baseTableName: external_projects
            constraintName: fk_external_projects_users
        - dropColumn:
            tableName: external_projects
            columnName: user_id


